services:
  - type: web
    name: vallegrande-backend-buildpack
    env: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/RestLosPinos-1.0-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SERVER_PORT
        value: 8083
      - key: TNS_ADMIN
        value: /opt/render/project/src/Wallet_SistemaGestionVentas
    healthCheckPath: /actuator/health
    autoDeploy: true 